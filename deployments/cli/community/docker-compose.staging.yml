# Khelo / JIST — NestJS + Postgres stack (no Django / Celery / RabbitMQ)
# Build context: set PLANE_BACKEND_PATH to the plane-backend repo (sibling by default).

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-khelo}
  POSTGRES_USER: ${POSTGRES_USER:-khelo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khelo}
  POSTGRES_DB: ${POSTGRES_DB:-khelo}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-nest-env: &nest-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: ${PORT:-8000}
  DATABASE_URL: ${DATABASE_URL:-postgresql://khelo:khelo@plane-db:5432/khelo}
  SESSION_SECRET: ${SESSION_SECRET:-change-me-khelo-session-secret}
  APP_BASE_URL: ${WEB_URL:-http://localhost}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost/admin}
  CORS_ORIGINS: ${CORS_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost}}
  WEB_URL: ${WEB_URL:-http://localhost}

services:
  web:
    image: ${WEB_IMAGE:-khelo-tech/plane-frontend}:${APP_RELEASE:-latest}
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api

  admin:
    image: ${ADMIN_IMAGE:-khelo-tech/plane-admin}:${APP_RELEASE:-latest}
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    image: ${API_IMAGE:-khelo-tech/plane-backend}:${APP_RELEASE:-latest}
    build:
      context: ${PLANE_BACKEND_PATH:-../../../../plane-backend}
      dockerfile: Dockerfile
    command: ["api"]
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    environment:
      <<: [*nest-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - plane-db
      - plane-redis

  migrator:
    image: ${API_IMAGE:-khelo-tech/plane-backend}:${APP_RELEASE:-latest}
    build:
      context: ${PLANE_BACKEND_PATH:-../../../../plane-backend}
      dockerfile: Dockerfile
    command: ["migrate"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      <<: [*nest-env, *db-env]
    depends_on:
      - plane-db

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    image: ${PROXY_IMAGE:-khelo-tech/plane-proxy}:${APP_RELEASE:-latest}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  proxy_config:
  proxy_data:
